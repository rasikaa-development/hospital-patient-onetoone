server:
  port: 8080
spring:
  application:
    name: hospital-patient-onetoone
  datasource:
    url: jdbc:mysql://localhost:3306/hospitaldb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
